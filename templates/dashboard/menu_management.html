{% extends 'base.html' %}

{% block content %}

<div class="container-fluid">

    <div class="d-flex justify-content-between mb-4">

        <h2>
            🍽 Gestion des menus
        </h2>

        <a href="{% url 'meal_create' %}"
           class="btn btn-success">

            + Ajouter un repas

        </a>

    </div>

    <div class="card shadow">

        <div class="table-responsive">

            <table class="table table-hover">

                <thead>

                    <tr>

                        <th>Image</th>
                        <th>Nom</th>
                        <th>Prix</th>
                        <th>Disponible</th>
                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody>

                    {% for meal in meals %}

                    <tr>

                        <td>

                            <img src="{{ meal.image.url }}"
                                 width="80">

                        </td>

                        <td>
                            {{ meal.name }}
                        </td>

                        <td>
                            {{ meal.price }} FCFA
                        </td>

                        <td>

                            {% if meal.is_available %}

                                ✅

                            {% else %}

                                ❌

                            {% endif %}

                        </td>

                        <td>

                            <a href="#"
                               class="btn btn-warning btn-sm">

                                Modifier

                            </a>

                            <a href="#"
                               class="btn btn-danger btn-sm">

                                Supprimer

                            </a>

                        </td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

{% endblock %}
