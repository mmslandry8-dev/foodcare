{% extends 'base.html' %}

{% block content %}

<div class="container">

    <div class="card shadow border-0">

        <div class="card-header bg-warning">

            <h3 class="mb-0">

                ✏ Modifier un repas

            </h3>

        </div>

        <div class="card-body">

            <form method="POST"
                  enctype="multipart/form-data">

                {% csrf_token %}

                {{ form.as_p }}

                <div class="d-flex justify-content-between">

                    <a href="{% url 'menu_management' %}"
                       class="btn btn-secondary">

                        Retour

                    </a>

                    <button type="submit"
                            class="btn btn-success">

                        Enregistrer

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
